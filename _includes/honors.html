{% assign honors = site.data.data.honors %}
{% if honors %}
<section class="section honors-section">

  <h2 class="section-title">
    <span class="fa-stack fa-xs">
      <i class="fas fa-circle fa-stack-2x"></i>
      <i class="fas fa-award fa-stack-1x fa-inverse"></i>
    </span>
    {{ honors.title }}
  </h2>

  {% for honor in honors.items %}
  <div class="item honor-item">
    <div class="upper-row">
      <h3 class="job-title">{{ honor.title }}</h3>
      {% if honor.time %}
      <div class="time">{{ honor.time }}</div>
      {% endif %}
    </div><!--//upper-row-->
    {% if honor.details %}
    <div class="details">
      {{ honor.details | markdownify }}
    </div><!--//details-->
    {% endif %}
  </div><!--//item-->
  {% endfor %}

</section><!--//section-->
{% endif %}
