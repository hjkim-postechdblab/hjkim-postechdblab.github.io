career-profile:
    title: Research Interests
    summary: |
      - **Domain-specialized LLM agents:** multi-agent orchestration, intent decomposition
        and routing, and grounded tool use for high-stakes domains (insurance, finance).
      - **Retrieval-augmented generation (RAG) systems:** domain-organized index design,
        semantic chunking, hybrid retrieval, and principled evaluation (LLM-as-a-judge,
        regression testing) for production QA systems.
      - **LLM-driven data systems:** dataset curation, augmentation, and distillation for
        domain adaptation and fine-tuning; tool-augmented agents for grounded reasoning
        and action.
      - **Natural-language interfaces to databases:** robust dataset augmentation/cleaning
        and principled evaluation for NL2SQL, and multi-turn dialogue systems to databases.
      - **Large-scale retrieval & indexing:** hierarchical and multi-vector embeddings,
        cross-modal (text–image) retrieval, time-aware search, and approximate nearest
        neighbor (ANN) methods.
      - **Event-centric intelligence:** detecting and modeling real-world events from news,
        social media, and enterprise data for downstream analytics and decision support.

