        details: High-level pipeline for event detection and stock candidate surfacing (research prototype). Responsibilities - project lead, problem formulation, evaluation design, and coordination with the industry partner.

      - title: SW StarLab "Development of a Conversational and Self-Tuning DBMS"
        role: Project Lead
        time: 2018 - 2026.1
        details: Led efforts to make DBMSs usable to non-experts by building a natural-language interface to databases and automatic physical/knob tuning that simplifies performance optimization for practitioners. Responsibilities included NL2SQL modeling, dataset curation/augmentation, and evaluation infrastructure for robust QA over RDBMS.

      - title: Smart Structuring of Large-Scale Dark Data
        role: Project Lead
        time: 2017
        details: Developed a machine-learning-based framework to convert unstructured enterprise "Dark Data" into structured data. Delivered workflow components (preprocessing, candidate-set mapping, feature extraction, supervised learning and inference), a pilot on public job announcements, and an end-to-end automation plan including SQL/Python APIs.

