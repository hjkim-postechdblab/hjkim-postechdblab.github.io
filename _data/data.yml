industry:
    title: Industry Experience — Meritz Fire & Marine Insurance
    period: 2026.2 - present
    items:
      - title: "MeAI: AI Sales Assistant for Insurance Planners"
        role: AI Engineer, AI Innovation Center
        summary: >
          MeAI is an in-production AI sales assistant that answers insurance planners' (FPs')
          questions on coverage, claims, underwriting, sales strategy, and internal operations,
          grounded in company policy documents and enterprise data.
        highlights:
          - title: Agent architecture redesign (intent-graph multi-agent system)
            details: >
              Redesigned the query-processing pipeline from a single unidirectional planner
              into an intent-graph architecture: a router decomposes a multi-intent user query
              into a dependency graph of intents and dispatches each intent to domain-specialized
              expert agents (e.g., claims/coverage, underwriting, sales support), executing
              independent intents in parallel while propagating results along dependencies and
              synthesizing a single coherent answer - enabling compound questions that the
              previous planner could not handle.

          - title: Retrieval index design for domain-specialized RAG
            details: >
              Reorganized retrieval corpora into domain-organized indexes with semantic-unit
              chunking; condensed lengthy policy documents into coverage-level summary units and
              connected coverages to standardized disease/procedure classification codes,
              substantially improving retrieval precision for grounded answers.

          - title: Evaluation and quality infrastructure
            details: >
              Built automated quality assurance for LLM agents: pre-deployment regression gates
              that evaluate the exact release artifact, and nightly automated evaluation with
              LLM-as-a-judge scoring and day-over-day regression detection, with results persisted
              for monitoring. Established label-free evaluation methodology and expert-in-the-loop
              gold-set construction for coverage-analysis QA.

