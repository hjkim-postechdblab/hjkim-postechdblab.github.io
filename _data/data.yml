career-profile:
    title: Research Interests
    summary: |
      - **LLM-driven data systems & agents:** dataset curation, augmentation, and
        distillation for domain adaptation and fine-tuning; tool-augmented agents for
        grounded reasoning and action.
      - **Data systems for ML:** reproducible data/feature pipelines, end-to-end
        measurement, and model-in-the-loop monitoring.
      - **Large-scale retrieval & indexing:** hierarchical and multi-vector embeddings,
        cross-modal (text–image) retrieval, time-aware search, and approximate nearest
        neighbor (ANN) methods.
      - **Natural-language interfaces to databases:** robust dataset augmentation/cleaning
        and principled evaluation for NL2SQL, and multi-turn dialogue systems to databases.
      - **Event-centric intelligence:** detecting and modeling real-world events from news,
        social media, and enterprise data for downstream analytics and decision support.

